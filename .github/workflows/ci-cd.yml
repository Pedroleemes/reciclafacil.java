name: ReciclaFacil CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Configurar JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build e Testes com Maven
      run: mvn clean test

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Login no Azure Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    - name: Build e Push da Imagem Docker
      run: |
        docker build -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/reciclafacil:${{ github.sha }} .
        docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/reciclafacil:${{ github.sha }}

  deploy-staging:
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - name: Deploy para Azure Web App (Staging)
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'reciclafacil-staging'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        images: '${{ secrets.REGISTRY_LOGIN_SERVER }}/reciclafacil:${{ github.sha }}'

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Deploy para Azure Web App (Production)
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'reciclafacil-prod'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
        images: '${{ secrets.REGISTRY_LOGIN_SERVER }}/reciclafacil:${{ github.sha }}'