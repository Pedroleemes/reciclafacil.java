
name: ReciclaFacil CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Testes Maven e BDD
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Executar testes automatizados
        run: |
          chmod +x mvnw
          ./mvnw -B clean test

  docker-build:
    name: Construir imagem Docker
    needs: build-and-test
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Construir imagem Docker
        run: docker build -t reciclafacil:${{ github.sha }} .
